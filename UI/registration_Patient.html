<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link rel="stylesheet" href="css/form.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  </head>
  <body>
    <header class="header">
      <a href="#" class="logo"> <i class="fas fa-heartbeat"></i>MedXTech</a>
      <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="#Feedbacks">Feedbacks</a>
        <a href="#Social works">Social works</a>
        <a href="#Partners">Partners</a>
      </nav>
      <div id="menu-btn" class="fas fa-bars"></div>
    </header>
    <div class="form">
      <h2>Patient Signup</h2>
      <p>It's free and always will be.</p>
      <form id="signupForm" enctype="multipart/form-data">
        <div class="grid-details">
          <div class="input">
            <label>First Name</label>
            <input
              type="text"
              name="fname"
              placeholder="First Name"
              required
              pattern="[a-zA-Z'-'\s]*"
            />
          </div>
          <div class="input">
            <label>Last Name</label>
            <input
              type="text"
              name="lname"
              placeholder="Last Name"
              required
              pattern="[a-zA-Z'-'\s]*"
            />
          </div>
          <div class="input">
            <label>Email</label>
            <input
              type="email"
              name="email"
              placeholder="Enter Your Email"
              required
            />
          </div>
          <div class="input">
            <label>Phone</label>
            <input
              type="phone"
              name="phone"
              placeholder="Phone Number"
              required
              pattern="[0-9]{10}"
            />
          </div>
          <div class="input">
            <label>Password</label>
            <input
              type="password"
              name="pass"
              placeholder="Password"
              required
            />
          </div>
          <div class="input">
            <label>Confirm Password</label>
            <input
              type="password"
              name="cpass"
              placeholder="Confirm Password"
              required
            />
          </div>
        </div>
        <div class="profile-img">
          <div class="file-upload">
            <input
              type="file"
              id="image-preview"
              name="image"
              class="file-input"
            />
            <i class="fas fa-user-edit"></i>
          </div>
        </div>
        <div class="submit">
          <input type="submit" value="Signup Now" class="button" />
        </div>
      </form>
      <div class="link">
        Already Signup? <a href="Patient_Login.html">Login Now</a>
      </div>
    </div>

    <!-- ✅ UPDATED SIGNUP SCRIPT -->
    <script>
      $(document).ready(function () {
        $("#signupForm").on("submit", function (e) {
          e.preventDefault();

          const formData = new FormData(this);

          $.ajax({
            url: "http://127.0.0.1:5000/auth/signup",
            method: "POST",
            data: formData,
            processData: false,
            contentType: false,
            success: function (res) {
              alert(res.message);
              window.location.href = "Patient_Login.html";
            },
            error: function (xhr) {
              let errorMsg = "Signup failed.";
              if (xhr.responseJSON && xhr.responseJSON.error) {
                errorMsg = xhr.responseJSON.error;
              } else if (xhr.statusText) {
                errorMsg = xhr.statusText;
              }
              alert(errorMsg);
            },
          });
        });
      });
    </script>
  </body>
</html>
